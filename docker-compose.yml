services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cutroom
      POSTGRES_PASSWORD: cutroom
      POSTGRES_DB: cutroom
    ports: ['5433:5432']
    volumes: ['./.data/pg:/var/lib/postgresql/data']
  redis:
    image: redis:7-alpine
    ports: ['6380:6379']
    volumes: ['./.data/redis:/data']
